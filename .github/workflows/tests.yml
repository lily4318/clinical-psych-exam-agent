name: tests

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest

# Automatic push runs are intentionally paused because this private repository
# currently returns GitHub Actions startup_failure before any job is created.
# Re-enable push/pull_request triggers after the repository/account Actions
# execution setting is fixed; the pytest job itself remains defined here.
