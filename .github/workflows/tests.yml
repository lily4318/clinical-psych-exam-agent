name: tests

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest

# Run tests on pull requests and merged main commits; allow manual dispatch.
# Public-repository GitHub-hosted standard runners are used; no paid API keys.
# Post-merge main checks are evidence distinct from pre-merge PR checks.
# Keep main protected from untested candidate changes.
