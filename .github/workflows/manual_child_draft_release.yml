# Manual, owner-initiated delivery of two UNVERIFIED child/adolescent exam DOCX files.
# GitHub Releases assets are NOT GitHub Actions artifacts; no paid API, LFS,
# paid runner, artifact upload, or automatic publishing on pull requests.
# Draft release remains visible to repository collaborators, not a formal release.
name: manual child A/B Word draft delivery

"on":
  workflow_dispatch:
    inputs:
      items:
        description: "Diagnostic pairs per form (20 is NOT yet throughput-validated)"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "8"
          - "20"

# Only owner-initiated manual dispatches and owner-initiated reruns on main may publish.
# No pull_request / pull_request_target event and no model-generated shell code.
permissions:
  contents: write

concurrency:
  group: manual-child-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-draft:
    if: ${{ github.repository == 'lily4318/clinical-psych-exam-agent' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'lily4318' && github.triggering_actor == 'lily4318' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ITEMS: ${{ inputs.items }}
      OUT_DIR: /tmp/child-draft-delivery-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (Node.js 24)
        with:
          python-version: "3.11"
      - name: Validate bounded manual item count
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ITEMS" =~ ^(3|8|20)$ ]] || { echo 'Only 3, 8 or 20 pairs are allowed'; exit 1; }
      - name: Preflight free-runner delivery tooling before model inference
        shell: bash
        run: |
          set -euo pipefail
          # Fail in seconds rather than after 8+ paired CPU inferences if the
          # standard runner lacks GitHub CLI, jq, Docker or required CLI flags.
          for tool in docker gh jq curl sha256sum cmp; do
            command -v "$tool" >/dev/null || { echo "::error::Missing required tool: $tool"; exit 1; }
          done
          docker info >/dev/null
          gh release create --help | grep -F -- '--draft' >/dev/null
          gh release download --help | grep -F -- '--pattern' >/dev/null
          gh release delete --help | grep -F -- '--cleanup-tag' >/dev/null
      # Verify the token and GitHub Releases REST endpoint before expensive
      # model download/inference. This GET does NOT prove release write access.
      # Keep the token confined to this trusted step and the publish step.
      - name: Preflight authenticated GitHub Release API (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq 'length' >/dev/null
      - name: Install existing Python dependencies
        run: python -m pip install -e .
      # Pin the exact image digest observed in successful real 8+8 run #40436488179;
      # do not silently adopt a changed :latest runtime in a write-capable workflow.
      - name: Start local CPU-only Ollama (no model API charges)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name clinical-exam-ollama -e OLLAMA_CONTEXT_LENGTH=8192 -p 127.0.0.1:11434:11434 ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull free local diagnostic model
        run: docker exec clinical-exam-ollama ollama pull qwen2.5:3b
      - name: Generate real source-grounded parallel forms
        shell: bash
        run: |
          set -euo pipefail
          python -m src.child_exam_pipeline --auto-evidence --items "$ITEMS" --model qwen2.5:3b --timeout-seconds 300 --max-output-tokens 3072 --split-pair-inference --out "$OUT_DIR"
      - name: Verify exact two nonempty Word files before publication
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          a=("$OUT_DIR"/form_a_*.docx)
          b=("$OUT_DIR"/form_b_*.docx)
          [[ ${#a[@]} -eq 1 && ${#b[@]} -eq 1 ]] || { echo 'Expected exactly two Word files'; exit 1; }
          [[ "$(find "$OUT_DIR" -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 2 ]] || exit 1
          for file in "${a[0]}" "${b[0]}"; do
            [[ -s "$file" && "$(stat -c%s "$file")" -le 2097152 ]] || { echo 'Missing/oversized DOCX'; exit 1; }
          done
          python -m src.verify_external_delivery "${a[0]}" "${b[0]}" --items "$ITEMS"
          sha256sum "${a[0]}" "${b[0]}"
      - name: Publish only verified files as an owner-visible DRAFT GitHub Release
        if: ${{ success() && steps.verify.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          a=("$OUT_DIR"/form_a_*.docx)
          b=("$OUT_DIR"/form_b_*.docx)
          tag="child-unverified-draft-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          downloaded="$(mktemp -d)"
          cleanup_on_failure() {
            status=$?
            rm -rf "$downloaded"
            if [[ "$status" -ne 0 ]]; then
              gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
              echo 'Draft delivery failed; partial release cleanup attempted.'
            fi
          }
          trap cleanup_on_failure EXIT
          gh release create "$tag" "${a[0]}" "${b[0]}" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "UNVERIFIED child/adolescent A+B exam (${ITEMS} per form)" \
            --notes "Automated draft, NOT formal-v1.0. Structural DOCX checks passed; clinical/source semantic accuracy and psychometric equivalence NOT independently verified. Generated by free local qwen2.5:3b with official NICE excerpts. Do not use as validated clinical guidance."
          details="$(gh release view "$tag" --json isDraft,isPrerelease,assets,url)"
          if ! printf '%s' "$details" | jq -e \
            --arg a "$(basename "${a[0]}")" --arg b "$(basename "${b[0]}")" \
            '.isDraft == true and .isPrerelease == true and (.assets | length == 2) and ([.assets[] | select(.name == $a and .size > 0)] | length == 1) and ([.assets[] | select(.name == $b and .size > 0)] | length == 1)' >/dev/null; then
            echo 'Draft release asset metadata verification failed; no delivery claimed.'
            exit 1
          fi
          # Re-download the remote assets to prove retrievability and byte integrity.
          gh release download "$tag" --dir "$downloaded" --pattern '*.docx'
          [[ "$(find "$downloaded" -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 2 ]] || exit 1
          cmp -s "${a[0]}" "$downloaded/$(basename "${a[0]}")"
          cmp -s "${b[0]}" "$downloaded/$(basename "${b[0]}")"
          {
            echo '## UNVERIFIED child/adolescent Word drafts — owner-visible release'
            echo "Form A and B: **${ITEMS} items each**, structurally checked."
            echo 'These are draft release assets, not ChatGPT attachments or formal/clinically validated exams.'
            printf '%s' "$details" | jq -r '.url'
            printf '%s' "$details" | jq -r '.assets[] | "- [\(.name)](\(.url))"'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove local temporary drafts (no Actions artifact storage)
        if: always()
        shell: bash
        run: rm -rf "$OUT_DIR"
