# Development-only integration test: REAL official evidence + local model + two Word files.
# One paired item, not clinical validation, not a substitute for 20-item delivery.
# Public standard hosted runner only; no paid API, no larger runner or model artifact.
name: real child pair to two DOCX diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/real_child_pair_docx.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-child-pair:
    if: ${{ github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Python dependencies
        run: python -m pip install -e .
      - name: Start CPU-only local Ollama
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name clinical-exam-ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull free tiny diagnostic model (not a clinical quality model)
        run: docker exec clinical-exam-ollama ollama pull qwen2.5:0.5b
      - name: Generate ONE real source-grounded A/B pair
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          python -m src.child_exam_pipeline --auto-evidence --items 1 --model qwen2.5:0.5b --timeout-seconds 600 --out "$RUNNER_TEMP/real-child-pair"
      - name: Verify both generated DOCX files (reader layout and A-D explanations)
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files_a=("$RUNNER_TEMP"/real-child-pair/form_a_*.docx)
          files_b=("$RUNNER_TEMP"/real-child-pair/form_b_*.docx)
          [[ ${#files_a[@]} -eq 1 && ${#files_b[@]} -eq 1 ]] || { echo 'Expected exactly two Word files'; exit 1; }
          python -m src.verify_external_delivery "${files_a[0]}" "${files_b[0]}" --items 1
          sha256sum "${files_a[0]}" "${files_b[0]}"
      - name: Record diagnostic result and clean up draft files
        if: always()
        shell: bash
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo '## REAL clinical pair / two-DOCX integration diagnostic'
            echo 'Baseline: main d728665e626a59a08bd7587d6423909d0e14ebb4; pytest 263/263; source-only 1/1; nonclinical JSON 1/1.'
            echo "Generation: **$GENERATION_OUTCOME**; DOCX verification: **$VERIFICATION_OUTCOME**."
            echo 'Both steps must pass to claim one successful A/B pair. A red run is evidence of a real integration failure.'
            echo 'Model: qwen2.5:0.5b; source: live allowlisted NICE HTTPS; one pair only.'
            echo 'No mock, no paid API, no model fine-tuning; no artifact storage or automatic publishing.'
            echo 'This does NOT establish semantic source support, clinical safety, expert validation, psychometric equivalence, 20-pair throughput, or chat download links.'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/real-child-pair"
