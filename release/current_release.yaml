agent_state_version: 4
current_formal_release: formal-v1.0
formal_manifest: release/formal_release_v1.0.yaml
approval_record: release/approval_record_v1.0.md
latest_review_release: review-v0.2
review_manifest: review/release_manifest_v0.2.yaml
topic: 物質濫用與依賴之心理衡鑑與心理治療
storage:
  persistent_source_of_truth: GitHub
  repository: lily4318/clinical-psych-exam-agent
  google_drive: deleted
  note: 不再依賴或尋找任何舊 Google Drive 資料；若未來需要新增原始資料，應重新上傳或另行建立來源並明確記錄。
public_usage:
  entrypoint: START_HERE.md
  mode: repo_url_plus_short_task
  example: https://github.com/lily4318/clinical-psych-exam-agent 幫我做兒童版考卷
  public_repo_default_access: read_only
  persistent_customization: fork_repository
simulation_defaults:
  policy_file: config/simulation_policy.yaml
  historical_exam_window: latest_5_available_exam_years
  current_resolved_years: [111, 112, 113, 114, 115]
  default_items_per_form: 20
  ask_item_count_when_omitted: false
  honor_user_specified_item_count: true
  specified_parallel_count_means: each_form
forms:
  current_formal_snapshot:
    form_a: 甲卷 P01-P20
    form_b: 乙卷 P01-P20
  note: formal-v1.0 保留原 20 題正式版本；新的模擬測驗依 simulation_policy.yaml 決定近5年與題數。
approval:
  approved_by_user: true
  approval_date: 2026-10-16
continuation:
  start_here:
    - START_HERE.md
    - config/simulation_policy.yaml
    - release/current_release.yaml
    - agent/system_prompt.md
    - docs/NEW_CHAT_CONTINUATION.md
word_export:
  default_package:
    - 甲卷
    - 乙卷
    - 答案與解析
  after_formal_approval: ask_or_export
  if_user_previously_requested_word: export_immediately
ml_evaluation:
  policy_file: config/ml_evaluation_policy.yaml
  guide: docs/EVALUATION_GUIDE.md
  cadence: hourly
  evaluation_target: 0.90
  target_status: not_yet_verified
  metric: independently_adjudicated_new_exam_item_validity
  historical_diagnostic_train_years: [111, 112, 113, 114]
  historical_diagnostic_test_years: [115]
  historical_diagnostic_is_blind_test: false
  actual_model_fine_tuning: not_configured
  formal_release_changes_require_approval: true

research_and_optimization:
  resource_index: docs/ML_AGENT_RESEARCH_100_SOURCES.md
  roadmap: docs/LONG_TERM_EVALUATION_ROADMAP.md
  github_diagnostics: docs/GITHUB_CONNECTION_TROUBLESHOOTING.md
  sources_indexed: 100
  full_text_review_all_100: false
  evaluation_tracks: [regression, agent_task_success, expert_item_validity, psychometrics, operational_quality]
  github_connector_status: working
  sandbox_git_clone_status: dns_blocked
  github_actions_status: startup_failure_historical_smoke_pending
